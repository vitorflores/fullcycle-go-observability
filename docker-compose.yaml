services:
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:3.6.1
    restart: always
    ports:
      - "9411:9411"

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./.docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "13133:13133"
    depends_on:
      - zipkin

  servico-a:
    container_name: servico-a
    build:
      context: .
      args:
        SERVICO: servico-a
    environment:
      - HTTP_PORT=:8080
      - SERVICO_B_URL=http://servico-b:8181
      - REQUEST_NAME_OTEL=servico-a-request
      - OTEL_SERVICE_NAME=servico-a
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      - servico-b
      - otel-collector

  servico-b:
    container_name: servico-b
    build:
      context: .
      args:
        SERVICO: servico-b
    environment:
      - HTTP_PORT=:8181
      - REQUEST_NAME_OTEL=servico-b-request
      - OTEL_SERVICE_NAME=servico-b
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8181:8181"
    depends_on:
      - otel-collector
